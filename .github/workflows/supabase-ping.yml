name: Supabase Keep-Alive Ping

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "Error: NEXT_PUBLIC_SUPABASE_URL secret is not set"
            exit 1
          fi

          echo "Pinging $SUPABASE_URL/rest/v1/"

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$SUPABASE_URL/rest/v1/")

          echo "Response: $HTTP_CODE"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 500 ]; then
            echo "Supabase is alive"
          else
            echo "Unexpected response: $HTTP_CODE"
            exit 1
          fi
